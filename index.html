<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL GHOST</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .case-container {
            border: 2px solid #00ff00;
            padding: 30px;
            background: #111;
            box-shadow: 0 0 20px #00ff0055;
            text-align: center;
            border-radius: 5px;
            width: 80%;
            max-width: 500px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 5px; }
        .deploy-btn {
            background: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        .deploy-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 30px #00ff00;
        }
        .status { margin-top: 20px; font-size: 0.8rem; opacity: 0.7; }
        #hidden-script { display: none; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="case-container">
    <h1><span class="blink">●</span> GHOST_ENGINE v6.0</h1>
    <p>CARGADOR DE PAYLOAD UNIFICADO</p>
    <button class="deploy-btn" onclick="copyPayload()">EJECUTAR CARGA</button>
    <div id="status-msg" class="status">SISTEMA EN ESPERA...</div>
</div>

<textarea id="hidden-script">
// --- GHOST ENGINE v6.0: UNIFIED OVERLORD (AI + UNIVERSAL INJECTION) ---
const API_KEY = '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'; 

async function ultimateSolve() {
    const questionElement = document.querySelector('[data-functional-selector="block-title"]');
    const imageElement = document.querySelector('[data-functional-selector="media-container__media-image"]');
    const answerLabels = document.querySelectorAll('[data-functional-selector^="question-choice-text-"]');
    
    const potentialInputs = document.querySelectorAll('input, textarea, [contenteditable="true"]');
    let smartInput = null;
    potentialInputs.forEach(el => { if (el.offsetParent !== null && !el.disabled) smartInput = el; });

    if (questionElement && !questionElement.dataset.solved) {
        questionElement.dataset.solved = "true";
        
        const questionText = questionElement.innerText;
        const options = Array.from(answerLabels).map(btn => btn.innerText.trim());
        const imageUrl = imageElement ? imageElement.src : null;

        console.log("📡 ESCANEANDO OBJETIVO...");

        const modelToUse = "llama-3.1-8b-instant"; // Cambiado a Instant para máxima obediencia

        try {
            let messageContent = [{ 
                type: "text", 
                text: `Pregunta: "${questionText}". ${options.length ? "Opciones: [" + options.join(", ") + "]." : "Responde con la palabra exacta."} Responde SOLO con el texto de la respuesta corta.` 
            }];

            if (imageUrl) {
                const b64 = await getBase64(imageUrl);
                messageContent.push({ type: "image_url", image_url: { url: b64 } });
            }

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: modelToUse, messages: [{ role: "user", content: messageContent }], temperature: 0.0, max_tokens: 40 })
            });

            const data = await response.json();
            const aiAnswer = data.choices[0].message.content.trim();
            console.log(`🤖 IA (${modelToUse}):`, aiAnswer);

            if (smartInput) {
                console.log("⌨️ INYECTANDO EN INPUT...");
                smartInput.focus();
                const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value")?.set || Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value")?.set;
                setter.call(smartInput, aiAnswer);
                smartInput.dispatchEvent(new Event('input', { bubbles: true }));
                smartInput.dispatchEvent(new Event('change', { bubbles: true }));
                setTimeout(() => {
                    const submitBtn = document.querySelector('button[type="submit"]') || document.querySelector('[data-functional-selector="submit-button"]');
                    if (submitBtn) executeGhostClick(submitBtn);
                }, 500);

            } else if (answerLabels.length > 0) {
                let struck = false;
                answerLabels.forEach(label => {
                    const btnText = label.innerText.toLowerCase().trim();
                    const cleanAI = aiAnswer.toLowerCase().trim();
                    if (!struck && (btnText === cleanAI || btnText.includes(cleanAI) || cleanAI.includes(btnText) || 
                       (cleanAI.match(/true|verdadero/) && btnText.match(/true|verdadero/)) ||
                       (cleanAI.match(/false|falso/) && btnText.match(/false|falso/)))) {
                        executeGhostClick(label.closest('button'));
                        struck = true;
                    }
                });
            }
        } catch (e) {
            console.error("❌ ERROR:", e);
            questionElement.dataset.solved = null;
        }
    }
}

function executeGhostClick(btn) {
    if (!btn) return;
    const rKey = Object.keys(btn).find(k => k.startsWith('__reactProps') || k.startsWith('__reactEventHandlers'));
    if (rKey && btn[rKey].onClick) {
        btn[rKey].onClick({ preventDefault: () => {}, stopPropagation: () => {}, target: btn, currentTarget: btn, isTrusted: true });
    } else { btn.click(); }
    console.log("🎯 OBJETIVO IMPACTADO.");
}

async function getBase64(url) {
    const r = await fetch(url);
    const b = await r.blob();
    return new Promise(res => {
        const fr = new FileReader();
        fr.onloadend = () => res(fr.result);
        fr.readAsDataURL(b);
    });
}

const observer = new MutationObserver(() => ultimateSolve());
observer.observe(document.body, { childList: true, subtree: true });

console.clear();
console.log("%c💀 GHOST ENGINE v6.0 ACTIVADO", "color: #00ff00; font-size: 20px; font-weight: bold;");
</textarea>

<script>
    function copyPayload() {
        const copyText = document.getElementById("hidden-script");
        copyText.style.display = "block";
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        document.execCommand("copy");
        copyText.style.display = "none";

        const status = document.getElementById("status-msg");
        status.innerHTML = "✅ PAYLOAD COPIADO AL PORTAPAPELES. ESPERANDO INYECCIÓN...";
        status.style.color = "#fff";
        
        setTimeout(() => {
            status.innerHTML = "SISTEMA EN ESPERA...";
            status.style.color = "#00ff00";
        }, 3000);
    }
</script>

</body>
</html>
